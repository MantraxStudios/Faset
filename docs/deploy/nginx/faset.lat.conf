# nginx para faset.lat: HTTPS (Let's Encrypt) delante de la web servida por start.sh en
# 127.0.0.1:8871. El dominio está detrás de Cloudflare: la redirección a https mira la
# cabecera X-Forwarded-Proto para no entrar en bucle si Cloudflare llega por http.
#   Certificado: certbot certonly --webroot -w /var/www/certbot -d faset.lat

server {
    listen 80;
    listen [::]:80;
    server_name faset.lat www.faset.lat;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        if ($http_x_forwarded_proto != "https") { return 301 https://faset.lat$request_uri; }
        proxy_pass http://127.0.0.1:8871;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faset.lat;
    ssl_certificate     /etc/letsencrypt/live/faset.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faset.lat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on; gzip_vary on; gzip_proxied any; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8871;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Recursos con hash en el nombre: caché larga.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8871;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
