# nginx para faset.lat: pasa las peticiones a la web servida por start.sh en 127.0.0.1:8871.
# Lo instala deploy/setup-server.sh en /etc/nginx/sites-available/faset.lat; después
# 'certbot --nginx' añade el HTTPS (certificado de Let's Encrypt) y la redirección desde http.

upstream faset_web {
    server 127.0.0.1:8871;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name faset.lat www.faset.lat;

    # www.faset.lat -> faset.lat
    if ($host = www.faset.lat) {
        return 301 $scheme://faset.lat$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://faset_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recursos con hash en el nombre: caché larga también en nginx.
    location /_next/static/ {
        proxy_pass http://faset_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
